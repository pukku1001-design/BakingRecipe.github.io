<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 베이킹 레시피 아카이브</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #fcfbf7; color: #4a403a; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Header -->
    <header class="bg-amber-50 border-b border-amber-100 py-6 px-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-bold text-amber-900 tracking-tight">🥖 나의 베이킹 레시피 노트</h1>
            <button onclick="openModal()" class="bg-amber-700 hover:bg-amber-800 text-white px-4 py-2 rounded-xl font-medium shadow transition text-sm md:text-base">
                + 새 레시피 올리기
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 mt-8">
        <!-- 3x6 Grid (18 items per page) -->
        <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- 레시피 카드가 동적으로 여기에 들어갑니다 -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-center items-center gap-2 mt-10"></div>
    </main>

    <!-- Modal (레시피 작성/수정) -->
    <div id="recipe-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <h2 id="modal-title" class="text-xl font-bold text-amber-900 mb-4">새 레시피 등록</h2>
            <form id="recipe-form" onsubmit="saveRecipeData(event)" class="space-y-4">
                <input type="hidden" id="recipe-id">
                <div>
                    <label class="block text-sm font-medium text-amber-900 mb-1">레시피 제목</label>
                    <input type="text" id="title" required class="w-full px-3 py-2 border border-amber-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-amber-900 mb-1">카테고리</label>
                        <select id="category" class="w-full px-3 py-2 border border-amber-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                            <option value="쿠키/스콘">쿠키/스콘</option>
                            <option value="케이크/파운드">케이크/파운드</option>
                            <option value="발효빵/사워도우">발효빵/사워도우</option>
                            <option value="구움과자">구움과자</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-amber-900 mb-1">굽기 온도 및 시간</label>
                        <input type="text" id="baking-info" placeholder="예: 180도 20분" class="w-full px-3 py-2 border border-amber-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-amber-900 mb-1">완성 사진 첨부</label>
                    <input type="file" id="image-file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                </div>
                <div>
                    <label class="block text-sm font-medium text-amber-900 mb-1">재료</label>
                    <textarea id="ingredients" rows="3" placeholder="예: 강력분 300g, 설탕 30g..." class="w-full px-3 py-2 border border-amber-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-amber-900 mb-1">만드는 법</label>
                    <textarea id="instructions" rows="4" placeholder="조리 순서를 적어주세요..." class="w-full px-3 py-2 border border-amber-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-xl font-medium">취소</button>
                    <button type="submit" class="bg-amber-700 hover:bg-amber-800 text-white px-5 py-2 rounded-xl font-medium shadow">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 본인의 Firebase 설정값으로 교체하세요!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PASSWORD = "12181218"; // 🔒 원하시는 관리자 비밀번호로 변경하세요!

        let recipes = [];
        let currentPage = 1;
        const itemsPerPage = 18; // 3 * 6 그리드

        window.openModal = function() {
            const pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd !== ADMIN_PASSWORD) {
                if (pwd !== null) alert("비밀번호가 틀렸습니다.");
                return;
            }

            document.getElementById('modal-title').innerText = "새 레시피 등록";
            document.getElementById('recipe-form').reset();
            document.getElementById('recipe-id').value = '';
            document.getElementById('recipe-modal').classList.remove('hidden');
            document.getElementById('recipe-modal').classList.add('flex');
        }

        window.closeModal = function() {
            document.getElementById('recipe-modal').classList.remove('flex');
            document.getElementById('recipe-modal').classList.add('hidden');
        }

        // 데이터 불러오기 (누구나 조회 가능)
        async function fetchRecipes() {
            try {
                const querySnapshot = await getDocs(collection(db, "recipes"));
                recipes = [];
                querySnapshot.forEach((docSnap) => {
                    recipes.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderGrid();
            } catch (e) {
                console.error("데이터 로드 실패: ", e);
            }
        }

        // 레시피 저장 (등록 및 수정)
        window.saveRecipeData = async function(event) {
            event.preventDefault();
            const id = document.getElementById('recipe-id').value;
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const bakingInfo = document.getElementById('baking-info').value;
            const ingredients = document.getElementById('ingredients').value;
            const instructions = document.getElementById('instructions').value;
            const fileInput = document.getElementById('image-file');

            let imageUrl = "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600&auto=format&fit=crop&q=80";

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(uploadEvent) {
                    imageUrl = uploadEvent.target.result;
                    await commitToFirestore(id, { title, category, bakingInfo, ingredients, instructions, imageUrl });
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                if (id) {
                    const existing = recipes.find(r => r.id === id);
                    if (existing) imageUrl = existing.imageUrl;
                }
                await commitToFirestore(id, { title, category, bakingInfo, ingredients, instructions, imageUrl });
            }
        }

        async function commitToFirestore(id, data) {
            try {
                if (id) {
                    await updateDoc(doc(db, "recipes", id), data);
                } else {
                    await addDoc(collection(db, "recipes"), data);
                }
                closeModal();
                fetchRecipes();
            } catch (e) {
                console.error("저장 실패: ", e);
                alert("저장 중 오류가 발생했습니다.");
            }
        }

        // 화면 렌더링 (3*6 그리드)
        function renderGrid() {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = recipes.slice(startIndex, endIndex);

            if (currentItems.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-12 text-amber-800/60">등록된 레시피가 없습니다. 첫 레시피를 올려보세요!</p>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            currentItems.forEach(recipe => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden hover:shadow-md transition flex flex-col";
                card.innerHTML = `
                    <div class="h-48 overflow-hidden bg-amber-50">
                        <img src="${recipe.imageUrl}" alt="${recipe.title}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="inline-block px-2.5 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded-full mb-2">${recipe.category}</span>
                            <h3 class="font-bold text-lg text-amber-900 mb-1">${recipe.title}</h3>
                            <p class="text-xs text-amber-800/70 mb-3">🔥 ${recipe.bakingInfo || '온도/시간 미입력'}</p>
                            <p class="text-sm text-gray-600 line-clamp-2 mb-4">${recipe.instructions}</p>
                        </div>
                        <div class="flex justify-end gap-2 pt-3 border-t border-amber-50">
                            <button onclick="editRecipe('${recipe.id}')" class="px-3 py-1 text-xs bg-amber-50 hover:bg-amber-100 text-amber-900 rounded-lg font-medium">수정</button>
                            <button onclick="deleteRecipe('${recipe.id}')" class="px-3 py-1 text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg font-medium">삭제</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination();
        }

        // 페이지네이션 렌더링
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            const totalPages = Math.ceil(recipes.length / itemsPerPage);

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = `px-3.5 py-1.5 rounded-xl font-medium text-sm transition ${currentPage === i ? 'bg-amber-700 text-white shadow' : 'bg-white border border-amber-200 text-amber-900 hover:bg-amber-50'}`;
                btn.onclick = () => {
                    currentPage = i;
                    renderGrid();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                pagination.appendChild(btn);
            }
        }

        window.editRecipe = function(id) {
            const pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd !== ADMIN_PASSWORD) {
                if (pwd !== null) alert("비밀번호가 틀렸습니다.");
                return;
            }

            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;
            document.getElementById('modal-title').innerText = "레시피 수정";
            document.getElementById('recipe-id').value = recipe.id;
            document.getElementById('title').value = recipe.title;
            document.getElementById('category').value = recipe.category;
            document.getElementById('baking-info').value = recipe.bakingInfo || '';
            document.getElementById('ingredients').value = recipe.ingredients || '';
            document.getElementById('instructions').value = recipe.instructions || '';
            document.getElementById('recipe-modal').classList.remove('hidden');
            document.getElementById('recipe-modal').classList.add('flex');
        }

        window.deleteRecipe = async function(id) {
            const pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd !== ADMIN_PASSWORD) {
                if (pwd !== null) alert("비밀번호가 틀렸습니다.");
                return;
            }

            if (confirm("정말 이 레시피를 삭제하시겠습니까?")) {
                try {
                    await deleteDoc(doc(db, "recipes", id));
                    fetchRecipes();
                } catch (e) {
                    console.error("삭제 실패: ", e);
                }
            }
        }

        // 최초 실행 시 데이터 불러오기
        fetchRecipes();
    </script>
</body>
</html>
